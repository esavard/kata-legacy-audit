<div class="col-sm-4 col-sm-offset-4" style="margin-top:60px;">
    <h2>Warranty Claims</h2>
    <div class="alert alert-danger" ng-if="vm.error">{{vm.error}}</div>
    <form ng-submit="vm.login()">
        <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-control" ng-model="vm.username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" ng-model="vm.password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
</div>
